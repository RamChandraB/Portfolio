<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0a0d16" />
			<stop offset="0.5" stop-color="#05070d" />
			<stop offset="1" stop-color="#0c1119" />
		</linearGradient>
		<radialGradient id="oglow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#3d5a80" stop-opacity="0.45" />
			<stop offset="1" stop-color="#3d5a80" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0" />
			<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07" />
			<stop offset="1" stop-color="#ffffff" stop-opacity="0" />
		</linearGradient>
		<filter id="oblur" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="40" />
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#obg)" />
	<ellipse cx="1180" cy="220" rx="620" ry="420" fill="url(#oglow)" />
	<ellipse cx="260" cy="760" rx="520" ry="360" fill="url(#oglow)" opacity="0.7" />

	<!-- faceted obsidian shards -->
	<g opacity="0.5">
		<path d="M0 900 L 320 380 L 560 900 Z" fill="#0e131d" />
		<path d="M320 380 L 640 520 L 560 900 Z" fill="#121824" opacity="0.8" />
		<path d="M1600 900 L 1240 300 L 940 900 Z" fill="#0d121b" />
		<path d="M1240 300 L 980 560 L 1180 900 Z" fill="#131a26" opacity="0.75" />
	</g>

	<!-- diagonal sheen lines -->
	<g stroke="#8fa8c8" stroke-opacity="0.12" stroke-width="1.5">
		<line x1="-100" y1="200" x2="700" y2="-100" />
		<line x1="-100" y1="340" x2="900" y2="-40" />
		<line x1="700" y1="1000" x2="1700" y2="560" />
		<line x1="860" y1="1000" x2="1700" y2="700" />
	</g>

	<rect width="1600" height="900" fill="url(#sheen)" />
	<ellipse cx="800" cy="450" rx="900" ry="560" fill="none" stroke="#7f9bc0" stroke-opacity="0.06"
		stroke-width="60" filter="url(#oblur)" />
</svg>
