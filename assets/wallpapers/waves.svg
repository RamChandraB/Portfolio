<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#120a2e" />
			<stop offset="0.45" stop-color="#3b1259" />
			<stop offset="0.75" stop-color="#a3306b" />
			<stop offset="1" stop-color="#f2764b" />
		</linearGradient>
		<linearGradient id="wsun" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a8" />
			<stop offset="1" stop-color="#ff6b6b" />
		</linearGradient>
		<linearGradient id="ridgeA" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4b2a63" />
			<stop offset="1" stop-color="#1d0f33" />
		</linearGradient>
		<linearGradient id="ridgeB" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a1745" />
			<stop offset="1" stop-color="#140a26" />
		</linearGradient>
		<filter id="wglow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="34" />
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#wsky)" />

	<!-- stars -->
	<g fill="#fff5d6" opacity="0.75">
		<circle cx="180" cy="80" r="1.7" />
		<circle cx="420" cy="140" r="1.2" />
		<circle cx="640" cy="60" r="1.5" />
		<circle cx="1080" cy="110" r="1.4" />
		<circle cx="1320" cy="70" r="1.8" />
		<circle cx="1500" cy="160" r="1.2" />
	</g>

	<!-- retro sun -->
	<g>
		<circle cx="800" cy="470" r="180" fill="url(#wsun)" filter="url(#wglow)" opacity="0.7" />
		<circle cx="800" cy="470" r="170" fill="url(#wsun)" />
		<g fill="#3b1259" opacity="0.85">
			<rect x="600" y="430" width="400" height="10" />
			<rect x="600" y="458" width="400" height="14" />
			<rect x="600" y="492" width="400" height="20" />
			<rect x="600" y="532" width="400" height="28" />
		</g>
	</g>

	<!-- mountain ridges -->
	<path d="M0 620 L 220 470 L 380 560 L 520 430 L 720 620 Z" fill="url(#ridgeA)" />
	<path d="M560 620 L 800 420 L 980 540 L 1180 400 L 1420 620 Z" fill="url(#ridgeA)" />
	<path d="M1180 620 L 1380 500 L 1600 600 L 1600 620 Z" fill="url(#ridgeA)" />
	<path d="M0 700 L 260 560 L 480 680 L 700 540 L 960 700 L 1220 560 L 1600 700 L 1600 900 L 0 900 Z"
		fill="url(#ridgeB)" />

	<!-- reflected wave lines -->
	<g stroke="#ff9c6b" stroke-opacity="0.35" stroke-width="3">
		<line x1="120" y1="760" x2="480" y2="760" />
		<line x1="620" y1="790" x2="1080" y2="790" />
		<line x1="300" y1="820" x2="900" y2="820" />
		<line x1="1000" y1="850" x2="1480" y2="850" />
	</g>
	<rect x="0" y="640" width="1600" height="260" fill="#0d0620" opacity="0.55" />
</svg>
