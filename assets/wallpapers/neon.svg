<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0b0320" />
			<stop offset="0.55" stop-color="#2a0a4a" />
			<stop offset="0.72" stop-color="#7a1358" />
			<stop offset="1" stop-color="#12021f" />
		</linearGradient>
		<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe36e" />
			<stop offset="0.5" stop-color="#ff5f9e" />
			<stop offset="1" stop-color="#b02cff" />
		</linearGradient>
		<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#00e5ff" stop-opacity="0.85" />
			<stop offset="1" stop-color="#00e5ff" stop-opacity="0" />
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="16" />
		</filter>
		<filter id="glowsm" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="4" />
		</filter>
		<clipPath id="floor">
			<rect x="0" y="560" width="1600" height="340" />
		</clipPath>
	</defs>

	<rect width="1600" height="900" fill="url(#nsky)" />

	<!-- sun with retro bands -->
	<g>
		<circle cx="800" cy="520" r="210" fill="url(#sun)" opacity="0.95" />
		<circle cx="800" cy="520" r="210" fill="url(#sun)" filter="url(#glow)" opacity="0.55" />
		<g fill="#12021f">
			<rect x="560" y="470" width="480" height="14" />
			<rect x="560" y="500" width="480" height="18" />
			<rect x="560" y="534" width="480" height="24" />
		</g>
	</g>

	<!-- horizon glow -->
	<rect x="0" y="556" width="1600" height="10" fill="#ff77d1" filter="url(#glowsm)" />

	<!-- perspective grid -->
	<g clip-path="url(#floor)" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2" filter="url(#glowsm)">
		<line x1="800" y1="560" x2="-900" y2="900" />
		<line x1="800" y1="560" x2="-380" y2="900" />
		<line x1="800" y1="560" x2="60" y2="900" />
		<line x1="800" y1="560" x2="420" y2="900" />
		<line x1="800" y1="560" x2="700" y2="900" />
		<line x1="800" y1="560" x2="900" y2="900" />
		<line x1="800" y1="560" x2="1180" y2="900" />
		<line x1="800" y1="560" x2="1540" y2="900" />
		<line x1="800" y1="560" x2="1980" y2="900" />
		<line x1="800" y1="560" x2="2500" y2="900" />
		<line x1="0" y1="592" x2="1600" y2="592" />
		<line x1="0" y1="630" x2="1600" y2="630" />
		<line x1="0" y1="680" x2="1600" y2="680" />
		<line x1="0" y1="745" x2="1600" y2="745" />
		<line x1="0" y1="828" x2="1600" y2="828" />
	</g>

	<!-- skyline -->
	<g fill="#0d0426">
		<path d="M0 560 h120 v-90 h60 v-60 h70 v150 h90 v-120 h55 v120 h95 v-70 h50 v70 H0 Z" />
		<path d="M1600 560 h-140 v-110 h-60 v-70 h-80 v180 h-70 v-90 h-60 v90 h-90 v-50 h-45 v50 h545 Z" />
	</g>
	<g fill="#00e5ff" opacity="0.65">
		<rect x="150" y="430" width="6" height="10" />
		<rect x="205" y="470" width="6" height="10" />
		<rect x="330" y="470" width="6" height="10" />
		<rect x="1360" y="410" width="6" height="10" />
		<rect x="1470" y="470" width="6" height="10" />
	</g>
	<rect x="0" y="0" width="1600" height="900" fill="url(#fade)" opacity="0.08" />
</svg>
