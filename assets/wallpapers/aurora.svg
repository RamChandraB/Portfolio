<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="asky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#01040f" />
			<stop offset="0.55" stop-color="#04203a" />
			<stop offset="1" stop-color="#020b18" />
		</linearGradient>
		<linearGradient id="curtainA" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#5ef2b0" stop-opacity="0" />
			<stop offset="0.35" stop-color="#4ee6a8" stop-opacity="0.75" />
			<stop offset="1" stop-color="#1b7bd8" stop-opacity="0" />
		</linearGradient>
		<linearGradient id="curtainB" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#9df7ff" stop-opacity="0" />
			<stop offset="0.4" stop-color="#57d2ff" stop-opacity="0.6" />
			<stop offset="1" stop-color="#7b5cff" stop-opacity="0" />
		</linearGradient>
		<linearGradient id="curtainC" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#c8ff9c" stop-opacity="0" />
			<stop offset="0.45" stop-color="#8ef58a" stop-opacity="0.45" />
			<stop offset="1" stop-color="#1f8f7a" stop-opacity="0" />
		</linearGradient>
		<filter id="aglow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="30" />
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#asky)" />

	<!-- stars -->
	<g fill="#ffffff">
		<circle cx="120" cy="90" r="1.8" opacity="0.8" />
		<circle cx="340" cy="150" r="1.3" opacity="0.6" />
		<circle cx="520" cy="70" r="2" opacity="0.85" />
		<circle cx="690" cy="180" r="1.2" opacity="0.5" />
		<circle cx="880" cy="60" r="1.6" opacity="0.75" />
		<circle cx="1040" cy="140" r="1.1" opacity="0.5" />
		<circle cx="1220" cy="80" r="2.1" opacity="0.9" />
		<circle cx="1400" cy="170" r="1.4" opacity="0.6" />
		<circle cx="1520" cy="60" r="1.7" opacity="0.7" />
		<circle cx="230" cy="260" r="1.2" opacity="0.45" />
		<circle cx="760" cy="300" r="1.3" opacity="0.4" />
		<circle cx="1330" cy="280" r="1.5" opacity="0.5" />
	</g>

	<!-- aurora curtains -->
	<g filter="url(#aglow)">
		<path d="M120 120 C 300 240 240 430 420 560 L 560 560 C 420 400 470 250 330 110 Z" fill="url(#curtainA)" />
		<path d="M520 90 C 700 250 620 420 790 580 L 940 580 C 780 400 840 240 700 80 Z" fill="url(#curtainB)" />
		<path d="M900 140 C 1080 280 1000 440 1160 590 L 1300 590 C 1150 420 1210 260 1080 130 Z" fill="url(#curtainA)" />
		<path d="M1240 90 C 1420 250 1360 430 1520 570 L 1600 570 L 1600 120 C 1480 200 1420 160 1380 70 Z"
			fill="url(#curtainC)" />
	</g>

	<!-- lake glow -->
	<rect x="0" y="640" width="1600" height="260" fill="#04283f" opacity="0.55" />
	<g opacity="0.35" filter="url(#aglow)">
		<rect x="200" y="660" width="420" height="120" fill="#4ee6a8" />
		<rect x="820" y="670" width="480" height="110" fill="#57d2ff" />
	</g>

	<!-- mountains -->
	<path d="M0 660 L 240 500 L 420 640 L 620 470 L 860 660 Z" fill="#010912" />
	<path d="M700 660 L 950 480 L 1150 620 L 1340 500 L 1600 660 Z" fill="#020c18" />
	<rect x="0" y="655" width="1600" height="245" fill="#01060e" />
</svg>
