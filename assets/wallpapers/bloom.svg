<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1240" />
			<stop offset="0.45" stop-color="#2b2379" />
			<stop offset="1" stop-color="#140c38" />
		</linearGradient>
		<radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#8ad9ff" stop-opacity="0.55" />
			<stop offset="1" stop-color="#8ad9ff" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="petalA" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#00d3ff" stop-opacity="0.85" />
			<stop offset="1" stop-color="#7b5cff" stop-opacity="0.05" />
		</linearGradient>
		<linearGradient id="petalB" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#ff58c4" stop-opacity="0.8" />
			<stop offset="1" stop-color="#3a2bff" stop-opacity="0.05" />
		</linearGradient>
		<linearGradient id="petalC" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#38f2c0" stop-opacity="0.75" />
			<stop offset="1" stop-color="#1f5bff" stop-opacity="0.05" />
		</linearGradient>
		<path id="petal" d="M0 0 C 60 -250 300 -380 540 -330 C 380 -140 190 -30 0 0 Z" />
		<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="22" />
		</filter>
		<filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="46" />
		</filter>
	</defs>

	<rect width="1600" height="900" fill="url(#sky)" />
	<ellipse cx="820" cy="440" rx="620" ry="470" fill="url(#core)" />

	<g transform="translate(820 450)" filter="url(#soft)">
		<use href="#petal" fill="url(#petalA)" transform="rotate(-14) scale(1.45)" />
		<use href="#petal" fill="url(#petalB)" transform="rotate(52) scale(1.28)" />
		<use href="#petal" fill="url(#petalC)" transform="rotate(126) scale(1.4)" />
		<use href="#petal" fill="url(#petalA)" transform="rotate(196) scale(1.2)" />
		<use href="#petal" fill="url(#petalB)" transform="rotate(258) scale(1.5)" />
		<use href="#petal" fill="url(#petalC)" transform="rotate(318) scale(1.32)" />
	</g>

	<g transform="translate(820 450)" filter="url(#softer)" opacity="0.7">
		<use href="#petal" fill="url(#petalB)" transform="rotate(22) scale(1.9)" />
		<use href="#petal" fill="url(#petalA)" transform="rotate(160) scale(1.75)" />
		<use href="#petal" fill="url(#petalC)" transform="rotate(280) scale(2)" />
	</g>

	<g transform="translate(240 190)" filter="url(#softer)" opacity="0.4">
		<use href="#petal" fill="url(#petalA)" transform="rotate(96) scale(1.1)" />
		<use href="#petal" fill="url(#petalB)" transform="rotate(232) scale(0.9)" />
	</g>

	<g transform="translate(1420 780)" filter="url(#softer)" opacity="0.38">
		<use href="#petal" fill="url(#petalC)" transform="rotate(-42) scale(1.05)" />
		<use href="#petal" fill="url(#petalB)" transform="rotate(150) scale(0.95)" />
	</g>

	<rect width="1600" height="900" fill="#05061a" opacity="0.1" />
</svg>
